name: speedguard
description: SpeedGuard - alerta de radares para o mundo todo.
publish_to: 'none'
version: 1.29.12+78

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_tts: ^4.0.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  flutter_overlay_window: ^1.0.2
  android_intent_plus: '>=5.0.0 <7.0.0'
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  path_provider: ^2.1.4
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash.png
    - assets/icon.png
    - assets/sounds/
    - assets/tutorial.mp4
