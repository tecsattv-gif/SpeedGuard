name: Check (branches)

on:
  push:
    branches-ignore: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms android --org com.tecsattv --project-name speedguard .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
