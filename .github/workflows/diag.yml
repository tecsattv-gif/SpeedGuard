name: Diagnóstico Overpass
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Testar buscas de parks
        run: |
          B="50.75,5.20,51.20,5.90"
          Q1='[out:json][timeout:15];(nw["highway"="rest_area"]('$B');nw["highway"="services"]('$B');nw["amenity"="parking"]["hgv"~"^(yes|designated|only)$"]('$B');nw["parking"="truck_stop"]('$B'););out center tags;'
          for U in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $U"
            curl -s -o /tmp/o.json -w "HTTP %{http_code} em %{time_total}s, %{size_download} bytes\n" -m 40 -A "SpeedGuard/1.25 (Android; tecsattv-gif/SpeedGuard)" --data-urlencode "data=$Q1" "$U"
            head -c 300 /tmp/o.json; echo
            python3 -c "import json;d=json.load(open('/tmp/o.json'));print('elementos:',len(d.get('elements',[])),'remark:',d.get('remark'))" 2>&1 | tail -1
          done
          echo "== sem User-Agent"
          curl -s -o /tmp/o.json -w "HTTP %{http_code} em %{time_total}s\n" -m 40 --data-urlencode "data=$Q1" https://overpass-api.de/api/interpreter
