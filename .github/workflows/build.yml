name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gera os arquivos Android que faltam (não sobrescreve o que já existe)
      - name: Gerar projeto Android
        run: flutter create --platforms android --org com.tecsattv --project-name speedguard .

      - name: Dependências
        run: flutter pub get

      # Assinatura fixa: sem ela cada build sai com uma chave nova e o
      # Android recusa instalar por cima da versão anterior.
      - name: Chave de assinatura fixa
        env:
          KS: ${{ secrets.SPEEDGUARD_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Falta o segredo SPEEDGUARD_KEYSTORE (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SpeedGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedGuard-apk
          path: SpeedGuard.apk
