name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gera os arquivos Android que faltam (não sobrescreve o que já existe)
      - name: Gerar projeto Android
        run: flutter create --platforms android --org com.tecsattv --project-name speedguard .

      - name: Dependências
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SpeedGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedGuard-apk
          path: SpeedGuard.apk
