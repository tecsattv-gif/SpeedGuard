name: Build APK (Android 6)

# Segundo build, para aparelhos com Android 6 (ex.: GPS Garmin dēzlCam 785).
# O build normal (build.yml) usa um Flutter novo, que só gera app para
# Android 7+. Este usa o Flutter 3.32 (o último que ainda aceita Android 6)
# e publica o SpeedGuard-antigo.apk numa Release separada, de tag fixa
# "antigo" — fora da "latest", para o app normal nunca baixar este APK.

on:
  push:
    branches: [main, claude/android6]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Gerar projeto Android
        run: flutter create --platforms android --org com.tecsattv --project-name speedguard .

      # O workmanager 0.10 pede Flutter 3.38; o "pub get" misturava peças da
      # 0.9 com a interface da 0.10 e não compilava. Prende tudo na 0.9.
      - name: Dependências
        run: |
          set -o pipefail
          cat >> pubspec.yaml <<'YAML'

          dependency_overrides:
            workmanager: '>=0.9.0 <0.9.4'
            workmanager_android: '<0.9.3'
            workmanager_apple: '<0.9.4'
            workmanager_platform_interface: '<0.9.4'
          YAML
          flutter pub get 2>&1 | tee /tmp/pub.log || {
            M=$(tail -n 40 /tmp/pub.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pub get::$M"
            exit 1
          }
          V=$(grep -A8 -E "^  workmanager" pubspec.lock | grep -E "^  workmanager|version:" | tr -d '\n' | sed 's/  */ /g')
          echo "::notice title=workmanager::$V"

      # Mesma chave do build normal (android/signing.enc + SPEEDGUARD_KEYSTORE).
      - name: Chave de assinatura fixa
        env:
          KS: ${{ secrets.SPEEDGUARD_KEYSTORE }}
        run: |
          if [ -z "$KS" ] || [ ! -f android/signing.enc ]; then
            echo "::error::Falta o segredo SPEEDGUARD_KEYSTORE ou o arquivo android/signing.enc"
            exit 1
          fi
          PASS=$(printf '%s' "$KS" | sha256sum | cut -d' ' -f1)
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -in android/signing.enc \
            -out ~/.android/debug.keystore -pass "pass:$PASS"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            | grep -m1 "SHA256" || { echo "::error::Chave de assinatura ilegível"; exit 1; }

      - name: Ajustar o Gradle (chave, desugaring, minSdk 23)
        run: |
          python3 - <<'PY'
          import os, re
          ks = os.path.expanduser("~/.android/debug.keystore")
          kts = "android/app/build.gradle.kts"
          if os.path.exists(kts):
              f = kts
              s = open(f).read()
              blk = ("    signingConfigs {\n"
                     "        getByName(\"debug\") {\n"
                     f"            storeFile = file(\"{ks}\")\n"
                     "            storePassword = \"android\"\n"
                     "            keyAlias = \"androiddebugkey\"\n"
                     "            keyPassword = \"android\"\n"
                     "        }\n    }\n")
              i = s.index("android {") + len("android {\n")
              s = s[:i] + blk + s[i:]
              s = s.replace("compileOptions {",
                            "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              s += ('\ndependencies {\n'
                    '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n')
              s = re.sub(r"minSdk *= *flutter\.minSdkVersion", "minSdk = 23", s)
          else:
              f = "android/app/build.gradle"
              s = open(f).read()
              blk = ("    signingConfigs {\n        debug {\n"
                     f"            storeFile file('{ks}')\n"
                     "            storePassword 'android'\n            keyAlias 'androiddebugkey'\n"
                     "            keyPassword 'android'\n        }\n    }\n")
              i = s.index("android {") + len("android {\n")
              s = s[:i] + blk + s[i:]
              s = s.replace("compileOptions {",
                            "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              s += ("\ndependencies {\n"
                    "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n")
              s = re.sub(r"minSdk(Version)? *=? *flutter\.minSdkVersion", "minSdk = 23", s)
          open(f, "w").write(s)
          PY
          grep -n "minSdk" android/app/build.gradle* || true
          grep -q "minSdk = 23" android/app/build.gradle* || { echo "::error::minSdk 23 não foi aplicado"; exit 1; }

      # SG_LEGACY=true: o app procura atualização na Release "antigo".
      # Se falhar, as linhas de erro viram anotação (dá para ler sem abrir o log).
      - name: Compilar APK
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=SG_LEGACY=true 2>&1 | tee /tmp/build.log || {
            M=$(grep -n -E "Error:|error:|rror •|What went wrong|cannot be smaller|requires|FAILURE|Could not|Unresolved|isn't defined|not found" -A2 /tmp/build.log \
                | head -n 70 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$M" ] || M=$(tail -n 50 /tmp/build.log | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build::$M"
            exit 1
          }

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SpeedGuard-antigo.apk

      - name: Conferir assinatura e Android mínimo
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}apksigner verify --print-certs SpeedGuard-antigo.apk | grep -E "SHA-256|DN"
          ${BT}apksigner verify --print-certs SpeedGuard-antigo.apk | grep -q "CN=SpeedGuard" || { echo "::error::APK assinado com chave errada"; exit 1; }
          # Precisa instalar no Android 6 (API 23): assinatura v1 e minSdk 23.
          ${BT}apksigner verify --min-sdk-version 23 SpeedGuard-antigo.apk || { echo "::error::APK não verifica no Android 6"; exit 1; }
          MIN=$(${BT}aapt2 dump badging SpeedGuard-antigo.apk | grep -o "sdkVersion:'[0-9]*'" | grep -o "[0-9]*")
          echo "minSdk do APK: $MIN"
          [ "$MIN" -le 23 ] || { echo "::error::APK saiu com minSdk $MIN (precisa ser 23)"; exit 1; }
          echo "::notice title=APK Android 6::minSdk $MIN, $(du -h SpeedGuard-antigo.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedGuard-antigo-apk
          path: SpeedGuard-antigo.apk

      # Release fixa "antigo" (pré-lançamento: não vira a "latest").
      # Link fixo: .../releases/download/antigo/SpeedGuard-antigo.apk
      - name: Publicar na Release "antigo"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NOTES="SpeedGuard $VER para aparelhos com Android 6 (ex.: Garmin dēzlCam). Em Android 7 ou mais novo use o SpeedGuard.apk da versão normal."
          if gh release view antigo >/dev/null 2>&1; then
            gh release upload antigo SpeedGuard-antigo.apk --clobber
            gh release edit antigo --title "SpeedGuard $VER (Android 6)" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create antigo SpeedGuard-antigo.apk --title "SpeedGuard $VER (Android 6)" \
              --notes "$NOTES" --prerelease --latest=false --target "$GITHUB_SHA"
          fi
