name: Base de parks e radares

# Gera a base própria de parks e radares a partir dos mapas do Geofabrik
# (OpenStreetMap) e publica no ramo "data" (sem histórico: cada semana
# substitui a anterior). O app baixa os pedaços de lá.
# Cada continente roda em paralelo (Europa, Américas do Norte, Central e
# do Sul); no fim um passo junta tudo e publica.
on:
  schedule:
    - cron: '17 3 * * 1'   # toda segunda, 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Só estes países (ids do Geofabrik, separados por espaço; vazio = todos)'
        required: false
        default: ''
      publish:
        description: 'Publicar no ramo data (desmarque para só testar)'
        type: boolean
        required: false
        default: true

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # A Europa é dividida em 4 partes que rodam ao mesmo tempo (1.29.5):
        # inteira, com as vias, passava do tempo limite do GitHub.
        include:
          - {region: europe, shard: 0, shards: 4}
          - {region: europe, shard: 1, shards: 4}
          - {region: europe, shard: 2, shards: 4}
          - {region: europe, shard: 3, shards: 4}
          - {region: north-america, shard: 0, shards: 2}
          - {region: north-america, shard: 1, shards: 2}
          - {region: central-america, shard: 0, shards: 1}
          - {region: south-america, shard: 0, shards: 1}
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-pyosmium
          # Mais espaço em disco (mapas grandes como França e EUA).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Baixar e filtrar os mapas (${{ matrix.region }} ${{ matrix.shard }})
        env:
          ONLY: ${{ github.event.inputs.only }}
          REGION: ${{ matrix.region }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          mkdir -p work
          curl -sfL https://download.geofabrik.de/index-v1-nogeom.json -o index.json
          # Países do continente (sem as regiões que juntam vários).
          python3 - > list.txt <<'PY'
          import json, os
          d = json.load(open('index.json'))
          skip = {'alps', 'britain-and-ireland', 'dach', 'us-midwest', 'us-northeast',
                  'us-pacific', 'us-south', 'us-west'}
          only = set(os.environ.get('ONLY', '').split())
          shard, shards = int(os.environ['SHARD']), int(os.environ['SHARDS'])
          # Peso aproximado (GB) dos mapas grandes, para dividir por igual.
          big = {'germany': 4.5, 'france': 4.6, 'great-britain': 2.0,
                 'italy': 2.0, 'poland': 1.9, 'spain': 1.3, 'netherlands': 1.3,
                 'austria': 0.8, 'belgium': 0.6, 'czech-republic': 0.9,
                 'switzerland': 0.5, 'ukraine': 1.1, 'sweden': 0.7,
                 'norway': 1.2, 'finland': 0.6, 'portugal': 0.4,
                 'us': 11.0, 'canada': 5.0, 'brazil': 1.9, 'mexico': 0.7}
          items = []
          for f in d['features']:
              p = f['properties']
              # Ids com "/" (ex.: us/texas) são pedaços de um país que já
              # está inteiro na lista.
              if (p.get('parent') != os.environ['REGION'] or p['id'] in skip
                      or '/' in p['id']):
                  continue
              if only and p['id'] not in only:
                  continue
              items.append((big.get(p['id'], 0.3), p['id'], p['urls']['pbf']))
          load = [0.0] * shards
          for w, i, u in sorted(items, reverse=True):
              k = load.index(min(load))
              load[k] += w
              if k == shard:
                  print(i, u)
          PY
          cat list.txt
          while read -r ID URL; do
            echo "== $ID"
            rm -f map.osm.pbf
            for try in 1 2 3; do
              curl -sfL "$URL" -o map.osm.pbf && break
              echo "  download falhou, tentando de novo"; sleep 20
            done
            [ -s map.osm.pbf ] || { echo "  pulando $ID"; continue; }
            osmium tags-filter map.osm.pbf \
              nwr/highway=rest_area,services nwr/amenity=parking nwr/parking=truck_stop \
              n/highway=speed_camera n/enforcement r/type=enforcement \
              -o "work/$ID.osm.pbf" --overwrite || echo "  filtro falhou em $ID"
            # Via de cada radar/park (tipo, número, mão única e rumo), para o
            # app avisar só os da via e do sentido do veículo (1.29.0).
            # (pula mapas enormes, como os EUA, por memória/tempo do runner)
            if [ -s "work/$ID.osm.pbf" ] && [ "$(stat -c%s map.osm.pbf)" -lt 6000000000 ]; then
              osmium tags-filter map.osm.pbf \
                w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street \
                -o roads.osm.pbf --overwrite < /dev/null \
              && osmium add-locations-to-ways -i sparse_mem_array roads.osm.pbf \
                -o roadsloc.osm.pbf --overwrite < /dev/null \
              && python3 tools/road_match.py "work/$ID.osm.pbf" roadsloc.osm.pbf \
                "work/$ID.roads.json" < /dev/null \
              || echo "  vias falharam em $ID"
              rm -f roads.osm.pbf roadsloc.osm.pbf
            fi
            rm -f map.osm.pbf
            ls -la "work/$ID.osm.pbf" || true
          done < list.txt
          ls work | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: filtered-${{ matrix.region }}-${{ matrix.shard }}
          path: |
            work/*.osm.pbf
            work/*.roads.json
          if-no-files-found: ignore
          retention-days: 3

  build:
    needs: filter
    # Só monta e publica se TODAS as partes deram certo: o ramo data é
    # substituído inteiro, e uma parte faltando apagava aquela região.
    if: needs.filter.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyosmium

      - uses: actions/download-artifact@v4
        with:
          pattern: filtered-*
          path: work
          merge-multiple: true

      - name: Montar os pedaços
        run: |
          ls work
          python3 tools/build_data.py work/*.osm.pbf work/*.roads.json
          du -sh out

      - name: Amostra das vias (teste)
        run: |
          python3 - <<'PY2'
          import json, glob
          n = 0
          for f in sorted(glob.glob('out/radars/*.json')):
              for r in json.load(open(f)):
                  if 'rd' in r and n < 8:
                      print(r['id'], r['lat'], r['lon'], r['rd']); n += 1
          PY2

      - name: Publicar no ramo data
        if: github.event_name == 'schedule' || github.event.inputs.publish != 'false'
        run: |
          cd out
          git init -q -b data
          git config user.name "SpeedGuard dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Base de parks e radares $(date +%F)"
          for try in 1 2 3 4; do
            git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data && break
            echo "push falhou, tentando de novo"; sleep 30
          done
