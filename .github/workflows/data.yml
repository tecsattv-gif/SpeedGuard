name: Base de parks e radares

# Gera a base própria de parks e radares a partir dos mapas do Geofabrik
# (OpenStreetMap) e publica no ramo "data" (sem histórico: cada semana
# substitui a anterior). O app baixa os pedaços de lá.
on:
  schedule:
    - cron: '17 3 * * 1'   # toda segunda, 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Só estes países (ids do Geofabrik, separados por espaço; vazio = Europa toda)'
        required: false
        default: ''

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool python3-pyosmium
          # Mais espaço em disco (mapas grandes como França e Alemanha).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Baixar e filtrar os mapas
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p work
          if [ -n "$ONLY" ]; then
            IDS="$ONLY"
          else
            # Países da Europa no Geofabrik (sem as regiões que juntam vários).
            curl -sfL https://download.geofabrik.de/index-v1-nogeom.json -o index.json
            IDS=$(python3 -c "
          import json
          d=json.load(open('index.json'))
          skip={'alps','britain-and-ireland','dach','europe'}
          print(' '.join(f['properties']['id'] for f in d['features']
                if f['properties'].get('parent')=='europe' and f['properties']['id'] not in skip))")
          fi
          echo "Países: $IDS"
          for ID in $IDS; do
            URL=$(python3 -c "
          import json,sys
          try:
            d=json.load(open('index.json'))
            for f in d['features']:
              if f['properties']['id']=='$ID': print(f['properties']['urls']['pbf']); break
          except Exception: print('https://download.geofabrik.de/europe/$ID-latest.osm.pbf')")
            [ -z "$URL" ] && URL="https://download.geofabrik.de/europe/$ID-latest.osm.pbf"
            echo "== $ID"
            for try in 1 2 3; do
              curl -sfL "$URL" -o map.osm.pbf && break
              echo "  download falhou, tentando de novo"; sleep 20
            done
            [ -s map.osm.pbf ] || { echo "  pulando $ID"; continue; }
            osmium tags-filter map.osm.pbf \
              nwr/highway=rest_area,services nwr/amenity=parking nwr/parking=truck_stop \
              n/highway=speed_camera n/enforcement r/type=enforcement \
              -o "work/$ID.osm.pbf" --overwrite
            rm -f map.osm.pbf
            ls -la "work/$ID.osm.pbf"
          done

      - name: Montar os pedaços
        run: |
          [ -f index.json ] || curl -sfL https://download.geofabrik.de/index-v1-nogeom.json -o index.json || true
          python3 tools/build_data.py work/*.osm.pbf
          du -sh out

      - name: Publicar no ramo data
        run: |
          cd out
          git init -q -b data
          git config user.name "SpeedGuard dados"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Base de parks e radares $(date +%F)"
          for try in 1 2 3 4; do
            git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data && break
            echo "push falhou, tentando de novo"; sleep 30
          done
